  <circle cx="580" cy="268" r="0.7" fill="#38bdf8" opacity="0"><animate attributeName="opacity" values="0;0.8;0.3;0.8;0" dur="2.3s" begin="0.7s" repeatCount="indefinite"/></circle>
  <circle cx="730" cy="260" r="1.3" fill="#fff" opacity="0"><animate attributeName="opacity" values="0;0.7;0.4;0.7;0" dur="2.8s" begin="1.2s" repeatCount="indefinite"/></circle>

  <!-- Floating code snippets -->
  <text x="22" y="200" font-family="monospace" font-size="12" fill="#7c3aed" opacity="0" transform="rotate(-18,22,200)">
    &lt;AI/&gt;
    <animate attributeName="opacity" values="0;0.35;0.2;0.35;0" dur="5s" begin="1s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-5;0,0" dur="5s" begin="1s" repeatCount="indefinite"/>
  </text>
  <text x="844" y="78" font-family="monospace" font-size="11" fill="#ec4899" opacity="0" transform="rotate(12,844,78)">
    ML{}
    <animate attributeName="opacity" values="0;0.3;0.15;0.3;0" dur="6s" begin="2s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-4;0,0" dur="6s" begin="2s" repeatCount="indefinite"/>
  </text>
  <text x="828" y="242" font-family="monospace" font-size="10" fill="#38bdf8" opacity="0" transform="rotate(-10,828,242)">
    &lt;/build&gt;
    <animate attributeName="opacity" values="0;0.28;0.12;0.28;0" dur="7s" begin="0.5s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-3;0,0" dur="7s" begin="0.5s" repeatCount="indefinite"/>
  </text>
  <text x="18" y="130" font-family="monospace" font-size="10" fill="#a78bfa" opacity="0" transform="rotate(8,18,130)">
    def ai():
    <animate attributeName="opacity" values="0;0.32;0.15;0.32;0" dur="5.5s" begin="3s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-4;0,0" dur="5.5s" begin="3s" repeatCount="indefinite"/>
  </text>
  <text x="20" y="58" font-family="monospace" font-size="10" fill="#f0abfc" opacity="0" transform="rotate(5,20,58)">
    0x7c3aed
    <animate attributeName="opacity" values="0;0.25;0.1;0.25;0" dur="6.5s" begin="1.5s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-3;0,0" dur="6.5s" begin="1.5s" repeatCount="indefinite"/>
  </text>

  <!-- Decorative corner brackets -->
  <g stroke="#7c3aed" stroke-width="1.5" fill="none" opacity="0.4">
    <polyline points="14,14 14,38 38,38"/>
    <polyline points="886,14 886,38 862,38"/>
    <polyline points="14,276 14,252 38,252"/>
    <polyline points="886,276 886,252 862,252"/>
  </g>

  <!-- Glow shadow for title -->
  <text x="450" y="133" text-anchor="middle" font-family="'Trebuchet MS',Georgia,serif" font-size="60" font-weight="900" fill="#6d28d9" opacity="0.25" letter-spacing="5">
    BANU PRAGATHI
  </text>

  <!-- Main title -->
  <text x="450" y="129" text-anchor="middle" font-family="'Trebuchet MS',Georgia,serif" font-size="60" font-weight="900" fill="url(#tg)" filter="url(#glow)" letter-spacing="5" opacity="0">
    BANU PRAGATHI
    <animate attributeName="opacity" values="0;0;1" dur="1.8s" fill="freeze"/>
  </text>

  <!-- Tagline -->
  <text x="450" y="172" text-anchor="middle" font-family="'Trebuchet MS',sans-serif" font-size="16" fill="#c4b5fd" letter-spacing="3" opacity="0">
    AI ENGINEER  ✦  FULL STACK BUILDER  ✦  CREATIVE INNOVATOR
    <animate attributeName="opacity" values="0;0;0;0.9" dur="2.6s" fill="freeze"/>
  </text>

  <!-- Divider -->
  <line x1="270" y1="192" x2="630" y2="192" stroke="url(#dg)" stroke-width="1.5" opacity="0">
    <animate attributeName="opacity" values="0;0;0;0.85" dur="3s" fill="freeze"/>
  </line>

  <!-- Bottom caption -->
  <text x="450" y="220" text-anchor="middle" font-family="monospace" font-size="13" fill="#a78bfa" letter-spacing="1" opacity="0">
