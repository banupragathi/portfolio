<svg width="900" height="290" viewBox="0 0 900 290" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07071a"/>
      <stop offset="45%" stop-color="#130526"/>
      <stop offset="100%" stop-color="#070718"/>
    </linearGradient>
    <linearGradient id="tg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa">
        <animate attributeName="stop-color" values="#a78bfa;#f0abfc;#38bdf8;#a78bfa" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#f0abfc">
        <animate attributeName="stop-color" values="#f0abfc;#38bdf8;#a78bfa;#f0abfc" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#a78bfa;#f0abfc;#38bdf8" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="dg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#7c3aed" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#7c3aed"/>
      <stop offset="50%"  stop-color="#ec4899"/>
      <stop offset="70%"  stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="290" fill="url(#bg)" rx="14"/>

  <!-- Grid -->
  <g opacity="0.055" stroke="#a78bfa" stroke-width="0.5">
    <line x1="0" y1="72" x2="900" y2="72"/><line x1="0" y1="144" x2="900" y2="144"/>
    <line x1="0" y1="216" x2="900" y2="216"/>
    <line x1="180" y1="0" x2="180" y2="290"/><line x1="360" y1="0" x2="360" y2="290"/>
    <line x1="540" y1="0" x2="540" y2="290"/><line x1="720" y1="0" x2="720" y2="290"/>
  </g>

  <!-- Glow orbs -->
  <circle cx="110" cy="75"  r="85"  fill="#7c3aed" filter="url(#soft)" opacity="0.0">
    <animate attributeName="opacity" values="0;0.13;0.08;0.13;0" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="800" cy="210" r="95"  fill="#ec4899" filter="url(#soft)" opacity="0.0">
    <animate attributeName="opacity" values="0;0.10;0.06;0.10;0" dur="9s" begin="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="450" cy="290" r="110" fill="#38bdf8" filter="url(#soft)" opacity="0.0">
    <animate attributeName="opacity" values="0;0.07;0.04;0.07;0" dur="7s" begin="4s" repeatCount="indefinite"/>
  </circle>

