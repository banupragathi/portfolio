  <circle cx="58"  cy="42"  r="0.9" fill="#c4b5fd" opacity="0"><animate attributeName="opacity" values="0;0.9;0.4;0.9;0" dur="1.9s" begin="0.3s" repeatCount="indefinite"/></circle>
  <circle cx="140" cy="12"  r="1.5" fill="#fff" opacity="0"><animate attributeName="opacity" values="0;0.7;0.2;0.7;0" dur="3.2s" begin="0.6s" repeatCount="indefinite"/></circle>
