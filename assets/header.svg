  <circle cx="490" cy="62"  r="0.7" fill="#38bdf8" opacity="0"><animate attributeName="opacity" values="0;0.9;0.3;0.9;0" dur="1.7s" begin="0.6s" repeatCount="indefinite"/></circle>
  <circle cx="660" cy="48"  r="1.1" fill="#fff" opacity="0"><animate attributeName="opacity" values="0;0.7;0.2;0.7;0" dur="3.3s" begin="1.4s" repeatCount="indefinite"/></circle>
