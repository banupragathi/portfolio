  <circle cx="700" cy="10"  r="0.8" fill="#a78bfa" opacity="0"><animate attributeName="opacity" values="0;1.0;0.3;1.0;0" dur="1.8s" begin="0.9s" repeatCount="indefinite"/></circle>
  <circle cx="775" cy="28"  r="1.3" fill="#fff" opacity="0"><animate attributeName="opacity" values="0;0.7;0.2;0.7;0" dur="3.0s" begin="0.5s" repeatCount="indefinite"/></circle>
  <circle cx="850" cy="15"  r="1.0" fill="#f0abfc" opacity="0"><animate attributeName="opacity" values="0;0.8;0.4;0.8;0" dur="2.1s" begin="0.0s" repeatCount="indefinite"/></circle>
  <circle cx="880" cy="45"  r="0.7" fill="#38bdf8" opacity="0"><animate attributeName="opacity" values="0;0.9;0.3;0.9;0" dur="1.7s" begin="1.3s" repeatCount="indefinite"/></circle>
